<!doctype html>
<html lang="en" data-theme="haunted">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenHop</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Haunted decorative background (non-interactive) -->
    <div class="h-bg" aria-hidden="true">
      <div class="h-stars"></div>
      <div class="h-moon"></div>
      <div class="h-house">
        <svg
          viewBox="0 0 120 60"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <polygon
            points="10,60 10,28 22,28 30,18 38,28 50,28 50,12 60,4 70,12 70,28 82,28 90,18 98,28 110,28 110,60"
            fill="#080808"
          ></polygon>
          <rect x="30" y="38" width="8" height="10" fill="#1b1025"></rect>
          <rect x="82" y="38" width="8" height="10" fill="#1b1025"></rect>
          <rect x="56" y="40" width="8" height="20" fill="#1b1025"></rect>
        </svg>
      </div>
      <div class="h-bat h-bat--1">
        <svg
          viewBox="0 0 24 14"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 4c-1-2-3-3-5-3 1 1 1 2 1 3-2-1-4-1-6 0 2 2 4 3 5 4-2 1-3 2-4 4 2-1 4-1 6 0 1 1 2 2 3 2s2-1 3-2c2-1 4-1 6 0-1-2-2-3-4-4 1-1 3-2 5-4-2-1-4-1-6 0 0-1 0-2 1-3-2 0-4 1-5 3z"
          ></path>
        </svg>
      </div>
      <div class="h-bat h-bat--2">
        <svg
          viewBox="0 0 24 14"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 4c-1-2-3-3-5-3 1 1 1 2 1 3-2-1-4-1-6 0 2 2 4 3 5 4-2 1-3 2-4 4 2-1 4-1 6 0 1 1 2 2 3 2s2-1 3-2c2-1 4-1 6 0-1-2-2-3-4-4 1-1 3-2 5-4-2-1-4-1-6 0 0-1 0-2 1-3-2 0-4 1-5 3z"
          ></path>
        </svg>
      </div>
      <div class="h-cobweb h-cobweb--tl">
        <svg
          viewBox="0 0 70 70"
          fill="none"
          stroke="currentColor"
          stroke-width="0.8"
          xmlns="http://www.w3.org/2000/svg"
        >
          <line x1="0" y1="0" x2="70" y2="70"></line>
          <line x1="0" y1="0" x2="70" y2="35"></line>
          <line x1="0" y1="0" x2="35" y2="70"></line>
          <line x1="0" y1="0" x2="70" y2="0"></line>
          <line x1="0" y1="0" x2="0" y2="70"></line>
          <path d="M0 0 Q12 12 24 12"></path>
          <path d="M0 0 Q18 18 36 18"></path>
          <path d="M0 0 Q24 24 48 24"></path>
          <path d="M0 0 Q10 10 10 20"></path>
          <path d="M0 0 Q20 20 20 40"></path>
        </svg>
      </div>
      <div class="h-cobweb h-cobweb--br">
        <svg
          viewBox="0 0 70 70"
          fill="none"
          stroke="currentColor"
          stroke-width="0.8"
          xmlns="http://www.w3.org/2000/svg"
        >
          <line x1="0" y1="0" x2="70" y2="70"></line>
          <line x1="0" y1="0" x2="70" y2="35"></line>
          <line x1="0" y1="0" x2="35" y2="70"></line>
          <path d="M0 0 Q12 12 24 12"></path>
          <path d="M0 0 Q18 18 36 18"></path>
          <path d="M0 0 Q24 24 48 24"></path>
        </svg>
      </div>
      <div class="h-spider">
        <svg
          viewBox="0 0 24 24"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <line
            x1="12"
            y1="8"
            x2="4"
            y2="2"
            stroke="currentColor"
            stroke-width="1"
          ></line>
          <line
            x1="12"
            y1="8"
            x2="20"
            y2="2"
            stroke="currentColor"
            stroke-width="1"
          ></line>
          <line
            x1="12"
            y1="16"
            x2="6"
            y2="22"
            stroke="currentColor"
            stroke-width="1"
          ></line>
          <line
            x1="12"
            y1="16"
            x2="18"
            y2="22"
            stroke="currentColor"
            stroke-width="1"
          ></line>
        </svg>
      </div>
      <div class="h-ghost">
        <svg
          viewBox="0 0 24 28"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 1C7 1 4 5 4 10v13l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V10c0-5-3-9-8-9zM9 9a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"
          ></path>
        </svg>
      </div>
      <div class="h-graveyard">
        <svg
          viewBox="0 0 16 16"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M3 16V7c0-2 2-3 4-3s4 1 4 3v9H3z"></path>
        </svg>
        <svg
          class="h-grass"
          viewBox="0 0 12 10"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M1 10V4l1 1V10zM4 10V2l1 1V10zM7 10V4l1 1V10zM10 10V3l1 1V10z"
          ></path>
        </svg>
        <svg
          viewBox="0 0 16 16"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M5 16V8c0-2 2-3 3-3s3 1 3 3v8H5z"></path>
        </svg>
        <svg
          class="h-grass"
          viewBox="0 0 12 10"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M1 10V4l1 1V10zM4 10V2l1 1V10zM7 10V4l1 1V10zM10 10V3l1 1V10z"
          ></path>
        </svg>
      </div>
    </div>
    <!-- Header -->
    <div class="header">
      <h1>
        <span class="h-pumpkin" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 4c-1 0-2 .3-2 .7C9 4.3 8 4 7 4 4 4 2 6.5 2 10s2 6 5 6c1 0 2-.3 3-.7.7.4 1.7.7 2 .7s1.3-.3 2-.7c1 .4 2 .7 3 .7 3 0 5-2.5 5-6s-2-6-5-6c-1 0-2 .3-3 .7-.7-.4-1.7-.7-2-.7z"
              fill="#ff9d2e"
              stroke="#080808"
              stroke-width="1"
            ></path>
            <rect
              x="11"
              y="2"
              width="2"
              height="3"
              fill="#304d2a"
              stroke="#080808"
              stroke-width="0.5"
            ></rect>
            <path d="M9 9l1 1-1 1zM15 9l-1 1 1 1z" fill="#080808"></path>
          </svg>
        </span>
        TokenHop
      </h1>
      <p>Hop cookies &amp; storage across sites</p>
      <div class="header-actions">
        <button
          class="icon-btn settings-btn"
          id="settingsBtn"
          title="Select cookies"
          aria-label="Settings"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Settings panel (selectors) -->
    <div
      class="settings-panel"
      id="settingsPanel"
      role="region"
      aria-label="Data selection"
    >
      <h2>Select Data to Copy</h2>
      <div
        class="subtab-bar"
        role="tablist"
        aria-label="Storage type selection"
      >
        <div
          class="subtab active"
          data-subtab="cookies"
          role="tab"
          tabindex="0"
          aria-selected="true"
        >
          🍪 Cookies
        </div>
        <div
          class="subtab"
          data-subtab="local"
          role="tab"
          tabindex="0"
          aria-selected="false"
        >
          💾 Local
        </div>
        <div
          class="subtab"
          data-subtab="session"
          role="tab"
          tabindex="0"
          aria-selected="false"
        >
          📦 Session
        </div>
      </div>
      <div class="subtab-panel active" id="subtab-cookies" role="tabpanel">
        <div id="cookieList"></div>
      </div>
      <div class="subtab-panel" id="subtab-local" role="tabpanel">
        <div id="lsList"></div>
      </div>
      <div class="subtab-panel" id="subtab-session" role="tabpanel">
        <div id="ssList"></div>
      </div>
      <div class="settings-section">
        <h3>Options</h3>
        <div class="cookie-toggle">
          <span>Auto Refresh after Paste</span>
          <label class="switch">
            <input type="checkbox" id="autoRefreshToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="settings-section">
        <div class="cookie-toggle cache-row">
          <span class="cache-label"
            >Cache: <strong id="cacheSize" class="cache-size">--</strong></span
          >
          <button class="btn-clear-cache" id="clearCacheBtn">
            Reset Extension
          </button>
        </div>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar" role="tablist" aria-label="Main navigation">
      <div
        class="tab active"
        data-tab="cookies"
        role="tab"
        tabindex="0"
        aria-selected="true"
      >
        Cookies
      </div>
      <div
        class="tab"
        data-tab="devtools"
        role="tab"
        tabindex="0"
        aria-selected="false"
      >
        Dev Tools
      </div>
      <div
        class="tab"
        data-tab="session"
        role="tab"
        tabindex="0"
        aria-selected="false"
      >
        Session
      </div>
      <div
        class="tab"
        data-tab="profiles"
        role="tab"
        tabindex="0"
        aria-selected="false"
      >
        Profiles
      </div>
    </div>

    <!-- Tab 1: Cookies -->
    <div class="tab-panel active" id="panel-cookies" role="tabpanel">
      <div class="action-row">
        <button class="btn btn-copy" id="copyBtn" title="Copy (Ctrl+Shift+C)">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path
              d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 0 2 2v1"
            ></path>
          </svg>
          Copy
        </button>
        <button
          class="btn btn-paste"
          id="pasteBtn"
          title="Paste (Ctrl+Shift+V)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            ></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
          Paste
        </button>
      </div>
      <button class="btn btn-view" id="viewBtn">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        View Stored Data
      </button>
    </div>

    <!-- Tab 2: Dev Tools -->
    <div class="tab-panel" id="panel-devtools" role="tabpanel">
      <div class="section-label">Clear Site Data</div>
      <div class="grid-2x2">
        <button class="btn btn-danger" id="clearCookiesBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
          </svg>
          Clear Cookies
        </button>
        <button class="btn btn-danger" id="clearLocalBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
          </svg>
          Clear Local
        </button>
        <button class="btn btn-danger" id="clearSessionBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
          </svg>
          Clear Session
        </button>
        <button class="btn btn-warning" id="nukeBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Nuke All
        </button>
      </div>

      <hr class="divider" />
      <div class="section-label">Share (only selected data)</div>
      <div class="action-row">
        <button
          class="btn btn-secondary"
          id="copyShareableBtn"
          title="Copy shareable (Ctrl+Shift+S)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
          Copy Shareable
        </button>
        <button class="btn btn-secondary" id="feedDataBtn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Feed Data
        </button>
      </div>

      <!-- Feed Data section (hidden by default) -->
      <div class="feed-section" id="feedSection">
        <textarea
          class="text-input"
          id="feedInput"
          placeholder="Paste shared data here (TH1:...)"
          aria-label="Shared data input"
        ></textarea>
        <div class="action-row feed-actions">
          <button class="btn btn-copy" id="feedApplyBtn">Apply Data</button>
          <button class="btn btn-secondary" id="feedCancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Tab 3: Session -->
    <div class="tab-panel" id="panel-session" role="tabpanel">
      <div class="section-label">Session Expiry Timer</div>
      <div id="sessionContent"></div>
    </div>

    <!-- Tab 4: Profiles -->
    <div class="tab-panel" id="panel-profiles" role="tabpanel">
      <div class="section-label">Save Current Cookies as Profile</div>
      <div class="input-row">
        <input
          type="text"
          class="text-input"
          id="profileNameInput"
          placeholder="Profile name (e.g. Admin, QA User)"
          aria-label="Profile name"
        />
        <button
          class="btn btn-copy btn-small save-profile-btn"
          id="saveProfileBtn"
        >
          Save
        </button>
      </div>
      <div class="section-label">Saved Profiles</div>
      <div class="profile-list" id="profileList"></div>
    </div>

    <!-- Status (shared across tabs) -->
    <div class="status" id="status" role="status" aria-live="polite">
      <button
        class="status-close"
        id="statusClose"
        title="Dismiss"
        aria-label="Dismiss status"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Token box (stored cookies view) -->
    <div class="token-box" id="tokenBox">
      <label>Stored Cookies</label>
      <div class="token-value" id="tokenValue"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
