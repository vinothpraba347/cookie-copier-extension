<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenHop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 320px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #ffffff;
        color: #111827;
        padding: 20px;
      }

      /* ---------- Header ---------- */
      .header {
        position: relative;
        text-align: center;
        margin-bottom: 20px;
        padding-right: 28px;
      }

      .header h1 {
        font-size: 15px;
        font-weight: 700;
        color: #111827;
        letter-spacing: 0.5px;
      }

      .header p {
        font-size: 11px;
        color: #6b7280;
        margin-top: 4px;
      }

      .settings-btn {
        position: absolute;
        top: 0;
        right: 0;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        background: transparent;
        color: #6b7280;
        cursor: pointer;
        transition:
          color 0.2s,
          transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .settings-btn:hover {
        color: #2563eb;
        transform: rotate(45deg);
      }

      .settings-btn svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      /* ---------- Settings panel ---------- */
      .settings-panel {
        display: none;
        margin-bottom: 18px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
      }

      .settings-panel.show {
        display: block;
      }

      .settings-panel h2 {
        font-size: 12px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 10px;
        text-align: center;
      }

      .settings-section {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #e5e7eb;
      }

      .settings-section h3 {
        font-size: 10px;
        font-weight: 700;
        color: #6b7280;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .settings-empty {
        font-size: 11px;
        color: #6b7280;
        text-align: center;
        font-style: italic;
      }

      .cookie-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #e5e7eb;
      }

      .cookie-toggle:last-child {
        border-bottom: none;
      }

      .cookie-toggle span {
        font-size: 12px;
        color: #111827;
        word-break: break-all;
        padding-right: 8px;
        flex: 1;
        min-width: 0;
      }

      .copy-icon {
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        background: transparent;
        color: #6b7280;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-left: 6px;
        transition:
          color 0.2s,
          transform 0.1s;
      }

      .copy-icon:hover {
        color: #2563eb;
      }

      .copy-icon:active {
        transform: scale(0.9);
      }

      .copy-icon.copied {
        color: #059669;
      }

      .copy-icon svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #d1d5db;
        transition: 0.2s;
        border-radius: 20px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: #ffffff;
        transition: 0.2s;
        border-radius: 50%;
      }

      .switch input:checked + .slider {
        background-color: #2563eb;
      }

      .switch input:checked + .slider:before {
        transform: translateX(16px);
      }

      .divider {
        border: none;
        border-top: 1px solid #f3f4f6;
        margin-bottom: 18px;
      }

      /* ---------- Action buttons ---------- */
      .action-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        letter-spacing: 0.3px;
        padding: 12px 14px;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      .btn-copy {
        flex: 1;
        background: #2563eb;
        color: #ffffff;
      }

      .btn-copy:hover {
        background: #1d4ed8;
      }

      .btn-paste {
        flex: 1;
        background: #059669;
        color: #ffffff;
      }

      .btn-paste:hover {
        background: #047857;
      }

      .btn-view {
        width: 100%;
        background: #7c3aed;
        color: #ffffff;
        margin-bottom: 10px;
      }

      .btn-view:hover {
        background: #6d28d9;
      }

      /* ---------- Status ---------- */
      .status {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        display: none;
      }

      .status.show {
        display: block;
      }

      .status.success {
        background: #ecfdf5;
        color: #059669;
        border: 1px solid #a7f3d0;
      }

      .status.error {
        background: #fef2f2;
        color: #dc2626;
        border: 1px solid #fecaca;
      }

      .status.info {
        background: #f5f3ff;
        color: #7c3aed;
        border: 1px solid #ddd6fe;
      }

      /* ---------- Token box ---------- */
      .token-box {
        margin-top: 10px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        display: none;
      }

      .token-box.show {
        display: block;
      }

      .token-box label {
        font-size: 10px;
        font-weight: 600;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      .token-value {
        margin-top: 8px;
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .stored-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px 12px;
        transition: border-color 0.2s;
      }

      .stored-card:hover {
        border-color: #2563eb;
      }

      .stored-card-name {
        font-size: 13px;
        font-weight: 700;
        color: #111827;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        word-break: break-all;
        margin-bottom: 6px;
      }

      .stored-card-value {
        font-size: 11px;
        color: #4b5563;
        word-break: break-all;
        font-family: "Courier New", monospace;
        line-height: 1.6;
        padding: 8px 10px;
        background: #f9fafb;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
        max-height: 60px;
        overflow-y: auto;
      }

      .stored-card-value::-webkit-scrollbar {
        width: 3px;
      }

      .stored-card-value::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
      }

      .token-value::-webkit-scrollbar {
        width: 4px;
      }

      .token-value::-webkit-scrollbar-track {
        background: #ffffff;
      }

      .token-value::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
      }

      .no-token {
        font-size: 11px;
        color: #6b7280;
        font-style: italic;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🔑 TokenHop</h1>
      <p>Hop cookies & access tokens across sites</p>
      <button class="settings-btn" id="settingsBtn" title="Select cookies">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
          ></path>
        </svg>
      </button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <h2>Select Cookies</h2>
      <div id="cookieList"></div>

      <div class="settings-section">
        <h3>Options</h3>
        <div class="cookie-toggle">
          <span>Auto Refresh after Paste</span>
          <label class="switch">
            <input type="checkbox" id="autoRefreshToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <div class="cookie-toggle" style="border-bottom: none">
          <span style="font-size: 11px; color: #6b7280"
            >Cache:
            <strong id="cacheSize" style="color: #111827">--</strong></span
          >
          <button
            id="clearCacheBtn"
            style="
              background: #dc2626;
              color: #fff;
              border: none;
              border-radius: 6px;
              padding: 4px 12px;
              font-size: 10px;
              font-weight: 600;
              cursor: pointer;
            "
          >
            Clear
          </button>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <!-- Copy & Paste side-by-side -->
    <div class="action-row">
      <button class="btn btn-copy" id="copyBtn">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path
            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 0 2 2v1"
          ></path>
        </svg>
        Copy
      </button>

      <button class="btn btn-paste" id="pasteBtn">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
          ></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        Paste
      </button>
    </div>

    <!-- View full-width below -->
    <button class="btn btn-view" id="viewBtn">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      View Stored Cookies
    </button>

    <div class="status" id="status"></div>

    <div class="token-box" id="tokenBox">
      <label>Stored Cookies</label>
      <div class="token-value" id="tokenValue"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
